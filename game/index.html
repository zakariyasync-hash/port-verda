<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151c">
<title>Port Verda — Kota Pelabuhan Terbuka</title>
<meta name="description" content="Port Verda: game open-world 2D di kota pelabuhan fiktif. Raka, kurir pelabuhan, bekerja untuk fixer Mira di tengah geng Harbor Kings.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Verda: kota pelabuhan terbuka. Raka, kurir pelabuhan, bekerja untuk fixer Mira di tengah geng Harbor Kings. Gerak dengan WASD atau panah, E masuk dan keluar mobil, F memukul, klik mouse menembak, Shift rem tangan, P jeda, M bisu."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff;font-family:sans-serif;padding:2em">Port Verda butuh JavaScript untuk berjalan.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
